<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>扫码看视频</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 750px;
        }

        video {
            width: 100%;
            display: block;
        }

        /* ========== 自定义控制栏 ========== */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            padding: 30px 12px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .controls.hidden { opacity: 0; pointer-events: none; }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            /* 增大移动端点击区域 */
            min-width: 44px;
            min-height: 44px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            /* 移动端增大触摸区域 */
            padding: 10px 0;
            background-clip: content-box;
        }

        .progress-fill {
            height: 4px;
            background: #ff4757;
            border-radius: 2px;
            width: 0%;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            display: none;
        }

        .progress-bar:hover .progress-fill::after { display: block; }

        .time {
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <video id="myVideo" playsinline webkit-playsinline 
               x5-video-player-type="h5" x5-video-orientation="portrait"
               preload="metadata">
            <source src="https://demo-video-seh.oss-cn-guangzhou.aliyuncs.com/Survivor%20demo.mp4" type="video/mp4">
        </video>

        <div class="controls" id="controls">
            <button id="playBtn">▶️</button>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time" id="timeDisplay">00:00 / 00:00</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const controls = document.getElementById('controls');

        // 播放/暂停
        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.textContent = '⏸️';
            } else {
                video.pause();
                playBtn.textContent = '▶️';
            }
        });

        // 点击视频区域也能播放/暂停
        video.addEventListener('click', () => {
            if (video.paused) { video.play(); playBtn.textContent = '⏸️'; }
            else { video.pause(); playBtn.textContent = '▶️'; }
        });

        // 更新进度条
        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            progressFill.style.width = percent + '%';

            const current = formatTime(video.currentTime);
            const total = formatTime(video.duration);
            timeDisplay.textContent = `${current} / ${total}`;
        });

        // 点击进度条跳转
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            video.currentTime = ratio * video.duration;
        });

        // 控制栏自动隐藏（3 秒无操作）
        let hideTimer;
        function showControls() {
            controls.classList.remove('hidden');
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => controls.classList.add('hidden'), 3000);
        }
        document.addEventListener('mousemove', showControls);
        document.addEventListener('touchstart', showControls);
        showControls();

        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
    </script>
</body>
</html>
